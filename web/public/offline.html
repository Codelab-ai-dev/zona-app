<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#16a34a" />
  <title>Sin conexión · Zona Gol</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #fff;
           font-family: ui-sans-serif, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 9999px; border: 2px solid rgb(34 197 94 / .5); }
    h1 { font-size: 1.5rem; margin: 1.25rem 0 .5rem; }
    p { color: #9ca3af; line-height: 1.5; margin: 0 0 1.5rem; }
    button { background: #16a34a; color: #fff; border: 0; padding: .75rem 1.5rem; font-size: 1rem; cursor: pointer; }
    button:focus-visible { outline: 2px solid #22c55e; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192x192.png" alt="Zona Gol" width="96" height="96" />
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Revisa tu red y vuelve a intentarlo; la información se actualizará en cuanto vuelvas a estar en línea.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
