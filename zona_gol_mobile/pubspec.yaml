name: zona_gol_mobile
description: Zona Gol - Complete mobile app for football league management
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Network & Backend
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Auth Social
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # QR & Camera
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  camera: ^0.11.0+2

  # UI & UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  animations: ^2.0.11
  flutter_svg: ^2.0.14
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  flutter_spinkit: ^5.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  logger: ^2.5.0

  # Permissions
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^14.6.2

  # Charts (for stats)
  fl_chart: ^0.70.1

  # Other
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.2

  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

