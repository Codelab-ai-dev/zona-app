# Full stack: Caddy (web + /api proxy, TLS in production) -> Go API -> Postgres.
# Usage from the repo root: `make up` (local) — see deploy/README.md.
# Secrets come from deploy/.env (generated locally by `make env`), never from
# this file.
name: zona

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zona
      POSTGRES_USER: zona
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zona -d zona"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build: ../backend
    image: zona-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zona:${POSTGRES_PASSWORD}@db:5432/zona?sslmode=disable
      HTTP_ADDR: ":8080"
      MIGRATE_ON_START: "true"
      STORAGE_DIR: /data
    ports:
      # Local only: lets `npm run dev` (Vite, proxy /api -> :8080) use this API.
      - "${API_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Public images (also served by Caddy at /media) and private files
      # (identity documents: only via signed API links) in separate volumes.
      - media_public:/data/public
      - media_private:/data/private
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  # MCP server for AI clients (issue #50, phase B): read-only public data.
  # Off by default, behind two switches: the service only starts with the
  # `mcp` profile (`make mcp-up`), and it refuses to start unless
  # MCP_PUBLIC=true; Caddy also only routes /mcp with MCP_PUBLIC=true.
  # See docs/architecture/ZONA_MCP.md.
  mcp:
    profiles: ["mcp"]
    image: zona-api:local
    restart: unless-stopped
    entrypoint: ["/mcp"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://zona:${POSTGRES_PASSWORD}@db:5432/zona?sslmode=disable
      MCP_ENABLED: "true"
      MCP_PUBLIC: ${MCP_PUBLIC:-false}
      MCP_HTTP_ADDR: ":8090"
      # Only Caddy and the host loopback mapping below reach this port.
      MCP_TRUSTED_PROXIES: ${MCP_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_RATE_LIMIT_RPS: ${MCP_RATE_LIMIT_RPS:-2}
      MCP_RATE_LIMIT_BURST: ${MCP_RATE_LIMIT_BURST:-20}
      MCP_MAX_CONCURRENT: ${MCP_MAX_CONCURRENT:-16}
    ports:
      # Local testing only (MCP Inspector, Claude Code). Never 0.0.0.0:
      # public traffic goes through Caddy at /mcp.
      - "${MCP_BIND:-127.0.0.1:8090}:8090"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  web:
    build:
      context: ../web
      args:
        # The web shows "Aplicaciones conectadas" only when the API has the
        # OAuth endpoints (#50 phase C).
        VITE_MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
    image: zona-web:local
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # /mcp is routed to the mcp service only when this is "true".
      MCP_PUBLIC: ${MCP_PUBLIC:-false}
    ports:
      - "${HTTP_BIND:-127.0.0.1:8088}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # nocopy + starting after the API: the API initializes this volume
      # (owned by its nonroot user); Caddy only reads it.
      - type: volume
        source: media_public
        target: /media
        read_only: true
        volume:
          nocopy: true
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [internal]

volumes:
  pgdata:
  media_public:
  media_private:
  caddy_data:
  caddy_config:

networks:
  internal:
