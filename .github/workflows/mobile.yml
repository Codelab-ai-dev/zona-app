name: mobile

on:
  push:
    paths: ["zona_gol_mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["zona_gol_mobile/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zona_gol_mobile
    steps:
      - uses: actions/checkout@v4
      # Gradle 8.14 (android/gradle/wrapper) does not run on Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            zona_gol_mobile/android/*.gradle*
            zona_gol_mobile/android/gradle/wrapper/gradle-wrapper.properties
      # Pinned so builds are reproducible; bump together with pubspec.lock.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Errors and warnings fail; style infos are reported but tolerated.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Debug build: proves the Android project compiles, needs no signing keys.
      - run: flutter build apk --debug
